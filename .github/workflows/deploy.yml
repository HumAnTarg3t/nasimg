name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Copy app files to deployment directory
        run: |
          cp -r functions helpers main.js package.json package-lock.json \
            /home/piuser/nasimg/

      - name: Install production dependencies
        run: npm ci --omit=dev --prefix /home/piuser/nasimg

      - name: Verify deployment
        run: test -f /home/piuser/nasimg/main.js
